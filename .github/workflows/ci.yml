name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Typkontroll och bygge
        run: npm run build

      - name: Tester
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # tsc körs som en del av build-scriptet
      - name: Typkontroll och bygge
        run: npm run build

  audit:
    name: Sårbarhetskoll
    runs-on: ubuntu-latest
    # Informerande – ska inte blockera en deploy för en sårbarhet i ett
    # byggtidsberoende som kräver majoruppgradering.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (backend)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
