services:
  backend:
    build: ./backend
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/cups.db
    env_file:
      - .env
    volumes:
      - db_data:/data
    restart: unless-stopped
    networks:
      - internal
    # multer använder memoryStorage och Gmail-bilagor buffras helt i minnet
    # innan storleken kontrolleras – utan tak kan en enskild stor fil dra ner
    # hela VPS:en istället för bara containern.
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_UMAMI_URL=${VITE_UMAMI_URL}
        - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID}
        - VITE_UMAMI_SHARE_URL=${VITE_UMAMI_SHARE_URL}
    restart: unless-stopped
    networks:
      - internal
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:

networks:
  internal:
    driver: bridge
