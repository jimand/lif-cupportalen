services:
  backend:
    build: ./backend
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/cups.db
    env_file:
      - .env
    volumes:
      - db_data:/data
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    networks:
      - internal

volumes:
  db_data:
  npm_data:
  npm_letsencrypt:

networks:
  internal:
    driver: bridge
