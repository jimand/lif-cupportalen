services:
  backend:
    build: ./backend
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/cups.db
    env_file:
      - .env
    volumes:
      - db_data:/data
    restart: unless-stopped
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    restart: unless-stopped
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
