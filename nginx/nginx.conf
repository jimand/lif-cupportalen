events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:80;
    }

    # HTTP: only Let's Encrypt challenge, redirect everything else to HTTPS
    server {
        listen 80;
        server_name cup.landvetterif.se;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # TODO: Aktivera när Certbot-certifikat finns på servern
        # Kör: certbot certonly --webroot -w /var/www/certbot -d cup.landvetterif.se
        # Avkommentera sedan raden nedan och ta bort location-blocken ovanför:
        # return 301 https://$host$request_uri;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server – aktivera när certifikat finns
    # server {
    #     listen 443 ssl;
    #     server_name cup.landvetterif.se;
    #
    #     ssl_certificate /etc/letsencrypt/live/cup.landvetterif.se/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/cup.landvetterif.se/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location /api/ {
    #         proxy_pass http://backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
